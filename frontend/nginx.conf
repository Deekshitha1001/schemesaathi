server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: the browser talks only to this server, so no CORS is needed.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # the backend's rate limiter reads this (TRUST_PROXY=true)
    client_max_body_size 12m;                         # voice uploads
    proxy_read_timeout 120s;                          # first Whisper request may download a model
  }

  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
}
